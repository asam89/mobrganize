name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example, v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve release tag
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${DISPATCH_VERSION}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.0.0" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - name: Test, lint, and build APK
        run: ./gradlew test lint assembleDebug

      - name: Prepare downloadable package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/lattice-launcher-${RELEASE_TAG}-debug.apk"
          sha256sum "dist/lattice-launcher-${RELEASE_TAG}-debug.apk" > dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-launcher-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "Lattice Launcher ${RELEASE_TAG}" \
              --notes "Installable debug-signed APK for testing. Download the APK on an Android device, allow installation from your browser or file manager, then select Lattice as the Home app."
          fi
